<title>5 ELEMENT — Live Preview</title>
<style>
:root{--gold:#ffd06a;--cyan:#4ef2ea;--ink:#080604}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#050403;color:white;font-family:Arial,Helvetica,sans-serif}
body{display:flex;justify-content:center;overflow-x:hidden}
.stage{position:relative;width:min(100vw,864px);aspect-ratio:864/1536;background:#0a0705;overflow:hidden;box-shadow:0 0 90px rgba(0,0,0,.75);isolation:isolate}
.poster{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;transform:scale(1.006);transition:transform .22s ease-out;z-index:0;user-select:none;-webkit-user-drag:none}
.vignette{position:absolute;inset:0;z-index:1;pointer-events:none;background:radial-gradient(circle at 50% 40%,transparent 52%,rgba(0,0,0,.18) 100%)}
.scan{position:absolute;inset:-20% 0;z-index:2;pointer-events:none;background:linear-gradient(180deg,transparent 0%,rgba(255,226,158,.0) 35%,rgba(255,226,158,.10) 49%,rgba(255,255,255,.16) 50%,rgba(255,226,158,.06) 51%,transparent 65%);transform:translateY(-45%);animation:scan 7s ease-in-out infinite}
@keyframes scan{0%,100%{transform:translateY(-45%)}50%{transform:translateY(45%)}}
.statusPulse{position:absolute;left:72.3%;top:4.65%;width:2.2%;aspect-ratio:1;border-radius:50%;z-index:4;pointer-events:none;background:var(--cyan);box-shadow:0 0 0 0 rgba(78,242,234,.65),0 0 18px rgba(78,242,234,.95);animation:pulse 1.8s ease-out infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(78,242,234,.58),0 0 14px rgba(78,242,234,.9)}70%{box-shadow:0 0 0 12px rgba(78,242,234,0),0 0 24px rgba(78,242,234,.85)}100%{box-shadow:0 0 0 0 rgba(78,242,234,0),0 0 14px rgba(78,242,234,.9)}}
.crystalGlow{position:absolute;z-index:3;pointer-events:none;border-radius:50%;mix-blend-mode:screen;filter:blur(2px);opacity:.75}
.crystalGlow::after{content:"";position:absolute;inset:-10%;border-radius:50%;border:1px solid currentColor;opacity:.28;animation:orbit 5s linear infinite}
@keyframes orbit{to{transform:rotate(360deg) scale(1.08)}}
.water{left:11.5%;top:27.0%;width:18.5%;height:14.7%;background:radial-gradient(circle,rgba(74,188,255,.24),rgba(74,188,255,.05) 45%,transparent 72%);color:#75d8ff;animation:breathe 3.6s ease-in-out infinite}
.fire{left:31.7%;top:24.8%;width:20.5%;height:18.8%;background:radial-gradient(circle,rgba(255,92,29,.38),rgba(255,92,29,.07) 48%,transparent 72%);color:#ff7d3f;animation:breathe 2.8s ease-in-out infinite reverse}
.earth{left:49.5%;top:27.0%;width:19.5%;height:15.6%;background:radial-gradient(circle,rgba(235,179,70,.24),rgba(235,179,70,.05) 46%,transparent 72%);color:#efc267;animation:breathe 4.2s ease-in-out infinite}
.air{left:71.0%;top:26.4%;width:17.8%;height:16.4%;background:radial-gradient(circle,rgba(229,243,255,.34),rgba(186,224,255,.08) 48%,transparent 72%);color:#eef8ff;animation:breathe 3.2s ease-in-out infinite reverse}
@keyframes breathe{0%,100%{transform:scale(.97);opacity:.58}50%{transform:scale(1.06);opacity:.95}}
.particle{position:absolute;width:3px;height:3px;border-radius:50%;z-index:4;pointer-events:none;background:#ffd27b;box-shadow:0 0 8px currentColor;animation:floatUp linear infinite;opacity:0}
@keyframes floatUp{0%{transform:translate3d(0,12px,0) scale(.7);opacity:0}12%{opacity:.85}80%{opacity:.55}100%{transform:translate3d(var(--dx),-95px,0) scale(1.2);opacity:0}}
.hotspot{position:absolute;left:13.7%;width:72.7%;height:5.65%;z-index:8;border-radius:18px;text-decoration:none;color:transparent;overflow:hidden;-webkit-tap-highlight-color:transparent;outline:none}
.hotspot::before{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 0 28%,rgba(255,255,255,.32) 42%,transparent 58%);transform:translateX(-130%);transition:transform .5s ease}
.hotspot:hover::before,.hotspot:focus-visible::before,.hotspot:active::before{transform:translateX(130%)}
.hotspot:focus-visible{box-shadow:0 0 0 2px var(--gold),0 0 30px rgba(255,208,106,.55)}
.hotspot:active{transform:scale(.992)}
.h1{top:62.62%;height:5.85%} .h2{top:69.67%} .h3{top:76.30%} .h4{top:82.91%} .h5{top:89.42%}
.toast{position:absolute;left:50%;bottom:3.2%;z-index:20;transform:translate(-50%,20px);padding:10px 14px;border:1px solid rgba(255,209,111,.45);border-radius:999px;background:rgba(10,7,4,.86);backdrop-filter:blur(10px);color:#ffe7ae;font-size:12px;letter-spacing:.04em;opacity:0;pointer-events:none;transition:.25s ease;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (min-width:865px){body{padding:24px}.stage{border-radius:26px}}
@media (prefers-reduced-motion:reduce){.scan,.statusPulse,.crystalGlow,.crystalGlow::after,.particle{animation:none!important}.poster{transition:none}}

/* ===== Universal responsive layout: phone / tablet / desktop ===== */
html,body{
  width:100%;
  min-width:100%;
  min-height:100%;
  margin:0;
  padding:0;
  overflow-x:hidden;
  background:#050403;
}
html{height:100%}
body{
  position:relative;
  display:flex!important;
  justify-content:center!important;
  align-items:flex-start!important;
  min-height:100vh;
  min-height:100svh;
  min-height:100dvh;
  padding:0!important;
}

/* Full-screen ambient background on wide screens */
.pageBackdrop{
  position:fixed;
  inset:-4vmax;
  width:calc(100% + 8vmax);
  height:calc(100% + 8vmax);
  object-fit:cover;
  object-position:center center;
  filter:blur(34px) brightness(.34) saturate(1.08);
  transform:scale(1.08);
  opacity:.88;
  z-index:-3;
  pointer-events:none;
  user-select:none;
}
body::after{
  content:"";
  position:fixed;
  inset:0;
  z-index:-2;
  pointer-events:none;
  background:
    radial-gradient(circle at 50% 35%,rgba(255,189,84,.06),transparent 45%),
    linear-gradient(180deg,rgba(0,0,0,.06),rgba(0,0,0,.30));
}

/* Main artwork always keeps its exact 9:16 geometry.
   All hotspots/effects remain aligned because they are percentage based. */
.stage{
  position:relative;
  flex:0 0 auto;
  width:min(100vw,calc(100dvh * 0.5625))!important;
  height:auto!important;
  min-height:0!important;
  aspect-ratio:9/16!important;
  margin:0 auto!important;
  border-radius:0!important;
  box-shadow:
    0 0 70px rgba(0,0,0,.58),
    0 0 1px rgba(255,208,106,.18)!important;
  overflow:hidden!important;
}
.poster{
  width:100%!important;
  height:100%!important;
  inset:0!important;
  object-fit:cover!important;
  object-position:center center!important;
}

/* Phones: artwork fills screen width naturally */
@media (max-aspect-ratio: 9/16){
  body{align-items:flex-start!important}
  .stage{
    width:100vw!important;
    height:auto!important;
    aspect-ratio:9/16!important;
  }
}

/* Tablets / desktop: full viewport height with ambient sides */
@media (min-aspect-ratio: 9/16){
  body{
    align-items:center!important;
    min-height:100vh;
    min-height:100dvh;
  }
  .stage{
    width:auto!important;
    height:100vh!important;
    height:100dvh!important;
    aspect-ratio:9/16!important;
  }
}

/* Landscape phones/tablets */
@media (orientation:landscape) and (max-height:700px){
  body{align-items:center!important}
  .stage{
    height:100dvh!important;
    width:auto!important;
  }
}

/* Keep interaction smooth on touch devices */
@media (hover:none),(pointer:coarse){
  .hotspot::before{transition:transform .34s ease}
  .poster{transition:none!important}
}

/* Prevent browser accessibility motion setting from freezing status/ambient UI entirely.
   Motion is still subtle and non-layout-shifting. */
@media (prefers-reduced-motion:reduce){
  .statusPulse{animation:pulse 1.8s ease-out infinite!important}
}

const stage=document.getElementById('stage');
const poster=document.getElementById('poster');
const toast=document.getElementById('toast');
let toastTimer;

const pageBackdrop=document.getElementById('pageBackdrop');
if(pageBackdrop && poster) pageBackdrop.src=poster.src;

function showToast(msg){toast.textContent=msg;toast.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.classList.remove('show'),1500)}
document.querySelectorAll('.hotspot').forEach(a=>{
  const href=LINKS[a.dataset.key]||'#'; a.href=href;
  if(href==='#') a.addEventListener('click',e=>{e.preventDefault();showToast('Ссылка пока не настроена')});
  else if(/^https?:|^tg:|^mailto:/i.test(href)){a.target='_blank';a.rel='noopener noreferrer'}
});
for(let i=0;i<30;i++){
  const p=document.createElement('i');p.className='particle';
  const zones=[[12,31,24,42],[32,48,26,43],[49,66,28,43],[70,87,27,43]];
  const z=zones[i%zones.length];
  p.style.left=(z[0]+Math.random()*(z[1]-z[0]))+'%';
  p.style.top=(z[2]+Math.random()*(z[3]-z[2]))+'%';
  p.style.setProperty('--dx',(Math.random()*40-20)+'px');
  p.style.animationDuration=(3.5+Math.random()*4)+'s';
  p.style.animationDelay=(-Math.random()*7)+'s';
  p.style.color=i%4===0?'#7ad9ff':i%4===1?'#ff8a4b':i%4===2?'#efc36a':'#eff8ff';
  stage.appendChild(p);
}
if(matchMedia('(pointer:fine)').matches){
  stage.addEventListener('pointermove',e=>{const r=stage.getBoundingClientRect();const x=(e.clientX-r.left)/r.width-.5;const y=(e.clientY-r.top)/r.height-.5;poster.style.transform=`scale(1.015) translate(${x*-5}px,${y*-5}px)`});
  stage.addEventListener('pointerleave',()=>poster.style.transform='scale(1.006)');
}
</script>
</body>
</html>
